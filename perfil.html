<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8b2bd9">
  <title>Perfil | Lilás Club</title>
  <style>
    :root{--lilas:#8b2bd9;--pink:#e834a6;--ink:#25162d;--muted:#766b7b;--line:#dcc7eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f0fd,#ead6f7);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}.top{height:88px;background:#f3e7fb;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:5}.back{font-size:31px;text-decoration:none;color:var(--ink)}.logo{display:block;width:min(235px,68vw);max-height:78px;object-fit:contain;object-position:left center}main{max-width:720px;margin:auto;padding-bottom:30px}.cover{aspect-ratio:4/5;background:linear-gradient(145deg,#e0c9ef,#f7edf9);display:flex;align-items:center;justify-content:center;color:#8f7998;font-weight:800;text-align:center}.cover img,.cover video{width:100%;height:100%;object-fit:cover;display:block}.cover video{background:#111}.video-note{font-size:11px;color:var(--muted);margin-top:7px;text-align:center}.content{padding:18px}.title{display:flex;align-items:center;gap:7px}.title h1{font-size:27px;margin:0}.verified{background:var(--lilas);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:13px}.location{color:var(--muted);margin:7px 0 10px}.test-badge{display:inline-block;margin:0 0 10px;background:#f2e2fb;color:#6f249f;border:1px solid #d7b7e9;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(83,32,113,.07)}.box h2{font-size:17px;margin:0 0 10px}.box p{line-height:1.55;margin:0;white-space:pre-wrap}.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.price{background:#f7effc;border-radius:11px;padding:11px;text-align:center}.price small{display:block;color:var(--muted)}.price strong{display:block;margin-top:4px}.whatsapp{display:block;margin:15px 0;background:linear-gradient(135deg,#1d9c55,#22bd68);color:#fff;text-align:center;text-decoration:none;padding:15px;border-radius:13px;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px}@media(min-width:720px){.cover{border-radius:0 0 22px 22px;max-height:650px}.content{padding:24px}}
  </style>
</head>
<body>
  <header class="top"><a class="back" href="index.html" aria-label="Voltar">‹</a><img class="logo" src="logo-lilas-club.png" alt="Lilás Club"></header>
  <main><div id="profile"></div></main>
  <script src="locations.js"></script>
  <script src="app.js"></script>
  <script>
    const selectedId=localStorage.getItem('lilasPerfilSelecionado');
    const selected=allProfiles().find(x=>x.id===selectedId)||allProfiles()[0];
    const raw=selected.raw||{}, allPhotos=raw.fotos||[selected.image].filter(Boolean), prices=raw.caches||{}, phone=(raw.telefone||'').replace(/\D/g,'');
    const videoMeta=firstVideoMeta(raw);
    const hasVideo=!!videoMeta?.id;
    const coverPhoto=selected.image||allPhotos[raw.capaIndex||0]||allPhotos[0]||'';
    const galleryPhotos=hasVideo ? allPhotos : allPhotos.filter((_,i)=>i!==(raw.capaIndex||0));
    document.title=`${selected.name} | Lilás Club`;
    async function renderProfile(){
      let coverHtml=coverPhoto?`<img src="${coverPhoto}" alt="${selected.name}">`:`Foto do perfil<br>${selected.name}`;
      let videoAvailable=false;
      if(hasVideo){
        const blob=await getStoredMedia(videoMeta.id);
        if(blob instanceof Blob){
          const url=URL.createObjectURL(blob);
          const poster=raw.videoPoster||videoMeta.poster||coverPhoto||'';
          coverHtml=`<video id="profileVideo" src="${url}" ${poster?`poster="${poster}"`:''} controls playsinline preload="metadata"></video>`;
          videoAvailable=true;
        }else if(raw.videoPoster||videoMeta.poster){
          coverHtml=`<img src="${raw.videoPoster||videoMeta.poster}" alt="Prévia do vídeo de ${selected.name}">`;
        }
      }
      document.querySelector('#profile').innerHTML=`<div class="cover">${coverHtml}</div>${hasVideo&&!videoAvailable?'<div class="video-note">Vídeo de teste salvo em outro navegador/dispositivo.</div>':''}<div class="content"><div class="title"><h1>${selected.name}${selected.age?`, ${selected.age}`:''}</h1>${selected.verified?'<span class="verified">✓</span>':''}</div><div class="location">${[selected.district,selected.city,selected.state].filter(Boolean).join(' • ')}</div>${raw.teste?'<div class="test-badge">PERFIL FICTÍCIO DE TESTE</div>':''}<div class="box"><h2>Sobre</h2><p>${raw.descricao||selected.text}</p></div>${(prices.min15||prices.min30||prices.hora1)?`<div class="box"><h2>Valores</h2><div class="prices"><div class="price"><small>15 min</small><strong>${prices.min15?'R$ '+prices.min15:'—'}</strong></div><div class="price"><small>30 min</small><strong>${prices.min30?'R$ '+prices.min30:'—'}</strong></div><div class="price"><small>1 hora</small><strong>${prices.hora1?'R$ '+prices.hora1:'—'}</strong></div></div></div>`:''}${galleryPhotos.length?`<div class="box"><h2>Galeria de fotos</h2><div class="gallery">${galleryPhotos.map(x=>`<img src="${x}" alt="Foto de ${selected.name}">`).join('')}</div></div>`:''}${phone?`<a class="whatsapp" href="https://wa.me/55${phone}">FALAR PELO WHATSAPP</a>`:''}</div>`;
    }
    renderProfile();
  </script>
</body>
</html>
