<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Lilás Club</title>

<style>

:root{
  --azul:#061a38;
  --azul2:#09264f;
  --lilas:#7835b5;
  --lilas2:#9b45c7;
  --rosa:#db2c73;
  --amarelo:#ffd45b;
  --branco:#ffffff;
  --texto:#26192d;
  --cinza:#776c80;
  --borda:#eadfec;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#faf8fc;
  color:var(--texto);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* TOPO */

header{
  background:linear-gradient(135deg,var(--azul),var(--azul2));
  color:white;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:16px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  color:var(--amarelo);
  font-size:25px;
  font-weight:950;
  letter-spacing:1px;
}

.anunciar{
  padding:11px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--lilas2),var(--rosa));
  color:white;
  font-size:13px;
  font-weight:900;
}


/* HERO */

.hero{
  background:linear-gradient(145deg,#071c3c,#0d3263);
  padding:22px 14px 38px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
}

.hero h1{
  margin:0;
  color:white;
  font-size:31px;
  line-height:1.08;
}

.hero p{
  color:#dce7f5;
  margin:10px 0 0;
  line-height:1.45;
}


/* BUSCA */

.search-area{
  max-width:1100px;
  margin:-22px auto 0;
  padding:0 12px;
  position:relative;
  z-index:3;
}

.search-box{
  background:white;
  padding:13px;
  border-radius:20px;
  box-shadow:0 12px 34px rgba(3,20,43,.18);
  border:1px solid var(--borda);

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:11px;
  color:#786d80;
  font-weight:900;
}

select,
input{
  min-height:48px;
  width:100%;
  border:1px solid #ddd0e3;
  border-radius:13px;
  padding:0 12px;
  outline:none;
  background:white;
  color:#281d30;
}

select:focus,
input:focus{
  border-color:var(--lilas);
  box-shadow:0 0 0 3px rgba(120,53,181,.10);
}

.full{
  grid-column:1/-1;
}

.search-button{
  grid-column:1/-1;
  min-height:50px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:950;
  background:linear-gradient(135deg,var(--lilas),var(--rosa));
}


/* CONTEÚDO */

main{
  max-width:1100px;
  margin:auto;
  padding:22px 12px 40px;
}

.result-top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin-bottom:13px;
}

.result-top h2{
  margin:0;
  font-size:22px;
}

.count{
  margin-top:3px;
  font-size:12px;
  color:var(--cinza);
}

.clear{
  border:0;
  background:transparent;
  color:var(--lilas);
  font-weight:900;
  padding:6px 2px;
}


/* PERFIS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.card{
  min-width:0;
  background:white;
  border:1px solid var(--borda);
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 7px 20px rgba(65,35,80,.07);
  cursor:pointer;
}

.photo{
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  position:relative;
  background:#eee8f2;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}

.no-photo{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#88768f;
  font-size:12px;
  font-weight:800;
  text-align:center;
  padding:15px;
}

.verified{
  position:absolute;
  left:7px;
  top:7px;
  font-size:9px;
  color:white;
  font-weight:900;
  background:rgba(63,28,87,.86);
  padding:6px 7px;
  border-radius:999px;
}

.heart{
  position:absolute;
  right:7px;
  top:7px;
  width:33px;
  height:33px;
  border:0;
  background:rgba(255,255,255,.94);
  border-radius:50%;
  color:#b62d82;
  font-size:18px;
}

.card-info{
  padding:10px;
}

.name{
  font-size:15px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.location{
  color:#817487;
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.description{
  color:#55495b;
  font-size:12px;
  line-height:1.35;
  margin-top:7px;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;

  min-height:32px;
}

.price{
  color:#6e299f;
  margin-top:8px;
  font-size:12px;
  font-weight:950;
}


/* SEM RESULTADO */

.empty{
  display:none;
  border:1px dashed #d6c5df;
  border-radius:18px;
  background:white;
  padding:32px 15px;
  text-align:center;
  color:#746879;
}

.empty strong{
  display:block;
  color:#291e30;
  margin-bottom:5px;
}


/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:99;
  display:none;
  padding:14px;
  overflow:auto;
  background:rgba(12,7,16,.70);
}

.modal.open{
  display:block;
}

.modal-box{
  max-width:520px;
  margin:20px auto;
  background:white;
  border-radius:22px;
  overflow:hidden;
}

.modal-photo{
  width:100%;
  aspect-ratio:3/4;
  max-height:550px;
  background:#eee8f2;
  overflow:hidden;
}

.modal-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-body{
  padding:16px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:start;
  gap:15px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  width:37px;
  height:37px;
  flex:0 0 37px;
  border-radius:50%;
  background:#f0e8f5;
  color:#66317e;
  font-size:21px;
}

.modal-location{
  color:#7b7081;
  font-size:13px;
  margin-top:5px;
}

.modal-description{
  margin-top:13px;
  line-height:1.5;
  color:#524759;
}

.prices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:15px;
}

.price-box{
  background:#fcf9fd;
  border:1px solid var(--borda);
  border-radius:13px;
  padding:10px 5px;
  text-align:center;
}

.price-box small{
  display:block;
  color:#84778b;
  font-size:10px;
}

.price-box strong{
  display:block;
  margin-top:4px;
  color:#6f2ca0;
  font-size:13px;
}

.whatsapp{
  width:100%;
  margin-top:14px;
  min-height:49px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:950;
  background:linear-gradient(135deg,#7430aa,#9c3bb5);
}


/* DESKTOP */

@media(min-width:760px){

  .search-box{
    grid-template-columns:1fr 1fr 1.3fr auto;
  }

  .full{
    grid-column:auto;
  }

  .search-button{
    grid-column:auto;
    align-self:end;
    padding:0 25px;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
  }

  .hero h1{
    font-size:43px;
  }
}

</style>
</head>

<script>


const $ =
id =>
document.getElementById(id);


const estado =
$("estado");

const cidade =
$("cidade");

const buscaLivre =
$("buscaLivre");

const grid =
$("grid");

const contador =
$("contador");

const vazio =
$("vazio");

const modal =
$("modal");


let perfis = [];

let perfilAtual = null;



/* TEXTO */

function texto(v){

if(
v === null ||
v === undefined
){

return "";

}

return String(v).trim();

}



/* REMOVE ACENTOS */

function normal(v){

return texto(v)

.normalize("NFD")

.replace(
/[\u0300-\u036f]/g,
""
)

.toLowerCase();

}



/* BUSCA CAMPO */

function pegar(
obj,
campos
){

for(
const campo
of campos
){

if(
obj &&
obj[campo] !== undefined &&
obj[campo] !== null &&
texto(obj[campo]) !== ""
){

return obj[campo];

}

}

return "";

}



/* LÊ JSON */

function json(v){

try{

return JSON.parse(v);

}

catch{

return null;

}

}



/* FOTO */

function acharFoto(p){

let foto =

pegar(
p,
[
"foto",
"fotoCapa",
"fotoPrincipal",
"capa",
"imagem",
"image",
"photo",
"avatar"
]
);


if(foto){

return foto;

}


const listas = [

p.fotos,
p.galeria,
p.imagens,
p.images

];


for(
const lista
of listas
){

if(
!Array.isArray(lista) ||
!lista.length
){

continue;

}


const primeira =
lista[0];


if(
typeof primeira === "string"
){

return primeira;

}


if(
primeira &&
typeof primeira === "object"
){

foto =

pegar(
primeira,
[
"url",
"src",
"foto",
"imagem"
]
);


if(foto){

return foto;

}

}

}


return "";

}



/* PREPARA PERFIL */

function preparar(p){

const caches =
p.caches || {};


return{


original:p,


nome:

pegar(
p,
[
"nome",
"name",
"apelido",
"titulo"
]
)
||
"Perfil",


idade:

pegar(
p,
[
"idade",
"age"
]
),


estado:

pegar(
p,
[
"estado",
"uf",
"state"
]
),


cidade:

pegar(
p,
[
"cidade",
"city",
"municipio"
]
),


bairro:

pegar(
p,
[
"bairro",
"neighborhood"
]
),


descricao:

pegar(
p,
[
"descricao",
"description",
"sobre",
"bio",
"frase"
]
),


categoria:

pegar(
p,
[
"categoria",
"category"
]
),


telefone:

pegar(
p,
[
"telefone",
"whatsapp",
"phone",
"contato"
]
),


foto:
acharFoto(p),


preco15:

pegar(
p,
[
"valor15",
"preco15",
"valor_15"
]
)

||

caches.min15

||
"",


preco30:

pegar(
p,
[
"valor30",
"preco30",
"valor_30"
]
)

||

caches.min30

||
"",


preco60:

pegar(
p,
[
"valor60",
"preco60",
"valor1h",
"preco1h"
]
)

||

caches.hora1

||
"",


verificado:

Boolean(
pegar(
p,
[
"verificado",
"verified"
]
)
)


};

}



/* CARREGA LOCALSTORAGE */

function carregarPerfis(){

const achados = [];


const chaves = [

"lilasPerfil",

"lilasPerfis",

"perfilLilas",

"perfisLilas",

"perfisLilás"

];


for(
const chave
of chaves
){

const bruto =
localStorage.getItem(chave);


if(!bruto){

continue;

}


const dado =
json(bruto);


if(
Array.isArray(dado)
){

achados.push(
...dado
);

}


else if(
dado &&
typeof dado === "object"
){

achados.push(dado);

}

}


/*
Procura qualquer outra chave
contendo lilas + perfil
*/

for(
let i=0;
i<localStorage.length;
i++
){

const chave =
localStorage.key(i);


const nome =
normal(chave);


if(
!nome.includes("lilas") ||
!nome.includes("perfil")
){

continue;

}


if(
chaves.includes(chave)
){

continue;

}


const dado =
json(
localStorage.getItem(chave)
);


if(
Array.isArray(dado)
){

achados.push(
...dado
);

}

else if(
dado &&
typeof dado === "object"
){

achados.push(dado);

}

}


/*
Remove duplicados
*/

const resultado = [];

const vistos =
new Set();


achados.forEach(p=>{

const perfil =
preparar(p);


const chave = [

normal(
perfil.nome
),

normal(
perfil.cidade
),

normal(
perfil.bairro
),

normal(
perfil.telefone
)

].join("|");


if(
vistos.has(chave)
){

return;

}


vistos.add(chave);

resultado.push(
perfil
);

});


return resultado;

}



/* NORMALIZA UF */

const nomesEstados = {

"acre":"AC",
"alagoas":"AL",
"amapa":"AP",
"amazonas":"AM",
"bahia":"BA",
"ceara":"CE",
"distrito federal":"DF",
"espirito santo":"ES",
"goias":"GO",
"maranhao":"MA",
"mato grosso":"MT",
"mato grosso do sul":"MS",
"minas gerais":"MG",
"para":"PA",
"paraiba":"PB",
"parana":"PR",
"pernambuco":"PE",
"piaui":"PI",
"rio de janeiro":"RJ",
"rio grande do norte":"RN",
"rio grande do sul":"RS",
"rondonia":"RO",
"roraima":"RR",
"santa catarina":"SC",
"sao paulo":"SP",
"sergipe":"SE",
"tocantins":"TO"

};


function estadoUF(v){

const valor =
normal(v);


if(!valor){

return "";

}


if(
valor.length === 2
){

return valor.toUpperCase();

}


return
nomesEstados[valor]
||
texto(v).toUpperCase();

}



/* DINHEIRO */

function dinheiro(v){

const valor =
texto(v);


if(!valor){

return "—";

}


if(
valor.toLowerCase().includes("r$")
){

return valor;

}


const numero =
Number(

valor

.replace(
/[^\d,.]/g,
""
)

.replace(
".",
""
)

.replace(
",",
"."
)

);


if(
Number.isFinite(numero) &&
numero > 0
){

return numero.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


return valor;

}



/* FOTO HTML */

function fotoHTML(p){

if(
!p.foto
){

return `

<div class="no-photo">

Foto do perfil

</div>

`;

}


return `

<img

src="${p.foto}"

alt="${p.nome}"

onerror="
this.parentElement.innerHTML =
'<div class=&quot;no-photo&quot;>Foto indisponível</div>'
"

>

`;

}



/* CRIA CARD */

function criarCard(p){

const card =
document.createElement(
"article"
);


card.className =
"card";


const nome =

p.idade

?

`${p.nome}, ${p.idade}`

:

p.nome;


const local = [

p.bairro,

p.cidade,

estadoUF(p.estado)

]

.filter(Boolean)

.join(" • ");


const preco =

p.preco60 ||

p.preco30 ||

p.preco15;


card.innerHTML = `


<div class="photo">


${fotoHTML(p)}


${
p.verificado

?

'<span class="verified">VERIFICADO</span>'

:

""
}


<button

class="heart"

type="button"

aria-label="Favoritar"

>

♡

</button>


</div>


<div class="card-info">


<div class="name">

${nome}

</div>


<div class="location">

${

local

||

"Local não informado"

}

</div>


<div class="description">

${

p.descricao

||

p.categoria

||

"Toque para ver o perfil."

}

</div>


<div class="price">

${

preco

?

"A partir de " +
dinheiro(preco)

:

"Consulte valores"

}

</div>


</div>


`;


card.addEventListener(
"click",
e=>{

if(
e.target.closest(
".heart"
)
){

return;

}


abrirPerfil(p);

}
);


const heart =
card.querySelector(
".heart"
);


heart.addEventListener(
"click",
e=>{

e.stopPropagation();


heart.textContent =

heart.textContent === "♡"

?

"♥"

:

"♡";

}
);


return card;

}



/* MOSTRA PERFIS */

function mostrar(lista){

grid.innerHTML =
"";


lista.forEach(p=>{

grid.appendChild(
criarCard(p)
);

});


const total =
lista.length;


contador.textContent =

total === 1

?

"1 perfil encontrado"

:

`${total} perfis encontrados`;


if(
total
){

grid.style.display =
"grid";

vazio.style.display =
"none";

}

else{

grid.style.display =
"none";

vazio.style.display =
"block";

}

}



/* BUSCAR */

function buscar(){

const filtroEstado =
estado.value;


const filtroCidade =
normal(
cidade.value
);


const filtroLivre =
normal(
buscaLivre.value
);


const resultado =
perfis.filter(p=>{


const ufPerfil =
estadoUF(
p.estado
);


const bateEstado =

!filtroEstado

||

ufPerfil === filtroEstado;


const bateCidade =

!filtroCidade

||

normal(
p.cidade
)
.includes(
filtroCidade
);


const textoCompleto = [

p.nome,

p.cidade,

p.bairro,

p.estado,

estadoUF(p.estado),

p.categoria,

p.descricao

]

.map(normal)

.join(" ");


const bateLivre =

!filtroLivre

||

textoCompleto.includes(
filtroLivre
);


return(

bateEstado &&

bateCidade &&

bateLivre

);


});


mostrar(
resultado
);

}



/* PERFIL */

function abrirPerfil(p){

perfilAtual =
p;


try{

localStorage.setItem(

"lilasPerfilSelecionado",

JSON.stringify(
p.original
)

);

}

catch{}


$("modalFoto")
.innerHTML =
fotoHTML(p);


$("modalNome")
.textContent =

p.idade

?

`${p.nome}, ${p.idade}`

:

p.nome;


$("modalLocal")
.textContent = [

p.bairro,

p.cidade,

estadoUF(p.estado)

]

.filter(Boolean)

.join(" • ");


$("modalDescricao")
.textContent =

p.descricao

||

"Sem descrição informada.";


$("preco15")
.textContent =
dinheiro(
p.preco15
);


$("preco30")
.textContent =
dinheiro(
p.preco30
);


$("preco60")
.textContent =
dinheiro(
p.preco60
);


$("btnWhatsapp")
.style.display =

p.telefone

?

"block"

:

"none";


modal.classList.add(
"open"
);

}



/* FECHAR */

function fecharModal(){

modal.classList.remove(
"open"
);

}



/* WHATSAPP */

function abrirWhatsapp(){

if(
!perfilAtual ||
!perfilAtual.telefone
){

return;

}


const numero =
texto(
perfilAtual.telefone
)
.replace(
/\D/g,
""
);


if(!numero){

return;

}


const mensagem =
encodeURIComponent(

`Olá! Vi o perfil de ${perfilAtual.nome} no Lilás Club.`

);


window.open(

`https://wa.me/${numero}?text=${mensagem}`,

"_blank"

);

}



/* EVENTOS */

$("btnBuscar")
.addEventListener(
"click",
buscar
);


cidade.addEventListener(
"keydown",
e=>{

if(
e.key === "Enter"
){

buscar();

}

}
);


buscaLivre.addEventListener(
"keydown",
e=>{

if(
e.key === "Enter"
){

buscar();

}

}
);


$("btnLimpar")
.addEventListener(
"click",
()=>{

estado.value =
"";

cidade.value =
"";

buscaLivre.value =
"";

mostrar(
perfis
);

}
);


$("btnFechar")
.addEventListener(
"click",
fecharModal
);


$("btnWhatsapp")
.addEventListener(
"click",
abrirWhatsapp
);


modal.addEventListener(
"click",
e=>{

if(
e.target === modal
){

fecharModal();

}

}
);



/* INICIA */

function iniciar(){

perfis =
carregarPerfis();


mostrar(
perfis
);


console.log(

"Lilás Club:",

perfis.length,

"perfil/perfis carregados"

);

}


iniciar();


</script>
