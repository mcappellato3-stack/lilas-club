<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Lilás Club | Encontre perfis na sua cidade"
  />

  <title>Lilás Club</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --lilas: #8b2cb3;
      --lilas-claro: #f4e6fa;
      --rosa: #d94fa3;
      --preto: #222;
      --cinza: #777;
      --fundo: #f7f7f7;
      --branco: #fff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--preto);
    }

    header {
      background: white;
      padding: 18px 16px;
      text-align: center;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 29px;
      font-weight: 800;
      color: var(--lilas);
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--rosa);
    }

    .container {
      width: min(100%, 1100px);
      margin: auto;
      padding: 18px 14px 40px;
    }

    .hero {
      background: linear-gradient(
        135deg,
        #8127a8,
        #c4479d
      );

      color: white;
      border-radius: 18px;
      padding: 25px 18px;
      margin-bottom: 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .hero p {
      font-size: 14px;
      opacity: 0.95;
    }

    .busca-box {
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
      margin-bottom: 22px;
    }

    .busca-box h2 {
      font-size: 17px;
      color: var(--lilas);
      margin-bottom: 13px;
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    select,
    input {
      width: 100%;
      height: 46px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--lilas);
    }

    #buscar {
      width: 100%;
      border: 0;
      margin-top: 11px;
      height: 48px;
      border-radius: 11px;
      background: var(--lilas);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #buscar:active {
      transform: scale(.99);
    }

    .topo-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 2px 14px;
    }

    .topo-resultados h2 {
      font-size: 19px;
    }

    #quantidade {
      font-size: 13px;
      color: #777;
    }

    #listaPerfis {
      display: grid;

      /* DUAS COLUNAS NO CELULAR */
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: 11px;
    }

    .perfil-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 2px 9px rgba(0,0,0,.09);
      cursor: pointer;
      transition: transform .15s ease;
      min-width: 0;
    }

    .perfil-card:active {
      transform: scale(.985);
    }

    /*
      IMPORTANTE:
      NÃO corta a foto.

      object-fit: contain faz a imagem
      inteira aparecer dentro do espaço.
    */
    .foto-box {
      width: 100%;
      height: 230px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .foto-box img {
      width: 100%;
      height: 100%;

      /* CORREÇÃO DA FOTO */
      object-fit: contain;

      object-position: center;
      display: block;
    }

    .perfil-info {
      padding: 10px;
    }

    .linha-nome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }

    .nome {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verificada {
      color: #7b27a5;
      font-size: 15px;
    }

    .local {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
      line-height: 1.3;
    }

    .descricao {
      margin-top: 7px;
      font-size: 12px;
      color: #555;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

      min-height: 30px;
    }

    .preco {
      font-weight: 800;
      color: var(--lilas);
      margin-top: 8px;
      font-size: 14px;
    }

    .recursos {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      font-size: 12px;
    }

    .recurso {
      background: var(--lilas-claro);
      color: var(--lilas);
      border-radius: 7px;
      padding: 4px 6px;
    }

    .sem-resultado {
      grid-column: 1 / -1;
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      color: #777;
    }

    .sem-resultado strong {
      display: block;
      color: var(--lilas);
      font-size: 17px;
      margin-bottom: 7px;
    }

    .acoes {
      margin-top: 24px;
      text-align: center;
    }

    .anunciar {
      display: inline-block;
      background: var(--rosa);
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 13px 22px;
      border-radius: 12px;
    }

    @media (min-width: 700px) {
      #listaPerfis {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .foto-box {
        height: 320px;
      }
    }

    @media (min-width: 1000px) {
      #listaPerfis {
        grid-template-columns:
          repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Lilás <span>Club</span>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>Encontre perfis perto de você</h1>
    <p>
      Escolha o estado e a cidade para encontrar perfis.
    </p>
  </section>

  <section class="busca-box">

    <h2>Onde você está?</h2>

    <div class="campos">

      <select id="estado">
        <option value="">
          Todos os estados
        </option>

        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
      </select>

      <input
        id="cidade"
        type="text"
        placeholder="Digite a cidade"
        autocomplete="off"
      >

    </div>

    <button id="buscar">
      BUSCAR
    </button>

  </section>

  <div class="topo-resultados">

    <h2>Perfis</h2>

    <span id="quantidade"></span>

  </div>

  <section id="listaPerfis"></section>

  <div class="acoes">
    <a
      class="anunciar"
      href="anunciar.html"
    >
      CRIAR PERFIL
    </a>
  </div>

</main>


<script>

  const listaPerfis =
    document.getElementById("listaPerfis");

  const campoEstado =
    document.getElementById("estado");

  const campoCidade =
    document.getElementById("cidade");

  const botaoBuscar =
    document.getElementById("buscar");

  const quantidade =
    document.getElementById("quantidade");


  /*
    Remove acentos, espaços extras
    e diferenças entre maiúsculas/minúsculas.

    Exemplo:
    São Paulo
    sao paulo
    SÃO PAULO

    passam a ser iguais.
  */

  function normalizar(texto) {

    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();

  }


  /*
    Procura os perfis salvos.
    Aceita tanto lilasPerfil quanto lilasPerfis.
  */

  function carregarPerfis() {

    let perfis = [];

    try {

      const varios =
        JSON.parse(
          localStorage.getItem("lilasPerfis")
        );

      if (Array.isArray(varios)) {
        perfis = [...varios];
      }

    } catch (erro) {
      console.log("Erro lendo lilasPerfis", erro);
    }


    try {

      const unico =
        JSON.parse(
          localStorage.getItem("lilasPerfil")
        );

      if (unico) {

        if (Array.isArray(unico)) {

          unico.forEach(perfil => {

            const existe =
              perfis.some(
                p =>
                  JSON.stringify(p) ===
                  JSON.stringify(perfil)
              );

            if (!existe) {
              perfis.push(perfil);
            }

          });

        } else {

          const existe =
            perfis.some(
              p =>
                JSON.stringify(p) ===
                JSON.stringify(unico)
            );

          if (!existe) {
            perfis.push(unico);
          }

        }

      }

    } catch (erro) {
      console.log("Erro lendo lilasPerfil", erro);
    }


    return perfis;

  }


  /*
    Encontra a foto mesmo se o formulário
    tiver salvo com nomes diferentes.
  */

  function obterFoto(perfil) {

    if (!perfil) return "";

    if (perfil.foto) return perfil.foto;

    if (perfil.fotoCapa) return perfil.fotoCapa;

    if (perfil.capa) return perfil.capa;

    if (perfil.imagem) return perfil.imagem;

    if (
      Array.isArray(perfil.fotos) &&
      perfil.fotos.length
    ) {
      return perfil.fotos[0];
    }

    if (
      Array.isArray(perfil.galeria) &&
      perfil.galeria.length
    ) {
      return perfil.galeria[0];
    }

    return "";

  }


  function obterNome(perfil) {

    return (
      perfil.nome ||
      perfil.nomeArtistico ||
      perfil.apelido ||
      "Perfil"
    );

  }


  function obterEstado(perfil) {

    return (
      perfil.estado ||
      perfil.uf ||
      perfil.state ||
      ""
    );

  }


  function obterCidade(perfil) {

    return (
      perfil.cidade ||
      perfil.city ||
      perfil.localidade ||
      ""
    );

  }


  function obterBairro(perfil) {

    return (
      perfil.bairro ||
      perfil.regiao ||
      ""
    );

  }


  function obterDescricao(perfil) {

    return (
      perfil.descricao ||
      perfil.bio ||
      perfil.frase ||
      perfil.sobre ||
      ""
    );

  }


  function obterPreco(perfil) {

    const preco =
      perfil.valor1hora ||
      perfil.valor1Hora ||
      perfil.valorHora ||
      perfil.precoHora ||
      perfil.valor ||
      "";

    if (!preco) {
      return "";
    }

    const texto = String(preco);

    if (
      texto.includes("R$") ||
      texto.includes("£") ||
      texto.includes("€")
    ) {
      return texto;
    }

    return "R$ " + texto;

  }


  /*
    Cria o card.
  */

  function criarCard(perfil, indice) {

    const card =
      document.createElement("article");

    card.className = "perfil-card";

    const foto = obterFoto(perfil);
    const nome = obterNome(perfil);
    const cidade = obterCidade(perfil);
    const bairro = obterBairro(perfil);
    const descricao = obterDescricao(perfil);
    const preco = obterPreco(perfil);

    const localTexto =
      [bairro, cidade]
        .filter(Boolean)
        .join(" • ");


    card.innerHTML = `

      <div class="foto-box">

        ${
          foto

          ? `
            <img
              src="${foto}"
              alt="${nome}"
            >
          `

          : `
            <div style="
              color:#888;
              text-align:center;
              padding:20px;
              font-size:13px;
            ">
              Sem foto
            </div>
          `
        }

      </div>


      <div class="perfil-info">

        <div class="linha-nome">

          <div class="nome">
            ${nome}
          </div>

          <div class="verificada">
            ✓
          </div>

        </div>


        ${
          localTexto
          ? `
            <div class="local">
              📍 ${localTexto}
            </div>
          `
          : ""
        }


        ${
          descricao
          ? `
            <div class="descricao">
              ${descricao}
            </div>
          `
          : ""
        }


        ${
          preco
          ? `
            <div class="preco">
              ${preco}
            </div>
          `
          : ""
        }


        <div class="recursos">

          ${
            perfil.video
            ? `<span class="recurso">▶ Vídeo</span>`
            : ""
          }

          ${
            perfil.audio
            ? `<span class="recurso">🎙 Áudio</span>`
            : ""
          }

        </div>

      </div>
    `;


    /*
      CARD INTEIRO CLICÁVEL
    */

    card.addEventListener("click", () => {

      localStorage.setItem(
        "lilasPerfilSelecionado",
        JSON.stringify(perfil)
      );

      localStorage.setItem(
        "lilasPerfilSelecionadoIndice",
        String(indice)
      );

      window.location.href = "perfil.html";

    });


    return card;

  }


  /*
    Mostra os resultados.
  */

  function mostrarPerfis(perfis) {

    listaPerfis.innerHTML = "";

    quantidade.textContent =
      perfis.length === 1
        ? "1 perfil"
        : `${perfis.length} perfis`;


    if (!perfis.length) {

      listaPerfis.innerHTML = `

        <div class="sem-resultado">

          <strong>
            Nenhum perfil encontrado
          </strong>

          Tente escolher outro estado
          ou digitar outra cidade.

        </div>
      `;

      return;

    }


    perfis.forEach((perfil, indice) => {

      listaPerfis.appendChild(
        criarCard(perfil, indice)
      );

    });

  }


  /*
    BUSCA CORRIGIDA
  */

  function buscarPerfis() {

    const todos =
      carregarPerfis();

    const estadoBuscado =
      normalizar(campoEstado.value);

    const cidadeBuscada =
      normalizar(campoCidade.value);


    const resultados =
      todos.filter(perfil => {

        const estadoPerfil =
          normalizar(
            obterEstado(perfil)
          );

        const cidadePerfil =
          normalizar(
            obterCidade(perfil)
          );


        /*
          Se nenhum estado estiver escolhido,
          não filtra por estado.
        */

        const estadoOk =
          !estadoBuscado ||
          estadoPerfil === estadoBuscado ||
          estadoPerfil.includes(estadoBuscado) ||
          estadoBuscado.includes(estadoPerfil);


        /*
          A cidade aceita começo do nome também.

          Exemplo:
          "sao"
          encontra
          "São Paulo".
        */

        const cidadeOk =
          !cidadeBuscada ||
          cidadePerfil.includes(cidadeBuscada) ||
          cidadeBuscada.includes(cidadePerfil);


        return estadoOk && cidadeOk;

      });


    mostrarPerfis(resultados);

  }


  botaoBuscar.addEventListener(
    "click",
    buscarPerfis
  );


  /*
    Também permite apertar Enter.
  */

  campoCidade.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        buscarPerfis();
      }

    }
  );


  /*
    Quando abrir a página,
    mostra os perfis cadastrados.
  */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      mostrarPerfis(
        carregarPerfis()
      );

    }
  );

</script>

</body>
</html>
