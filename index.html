<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lilás Club</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#faf8fc;
  color:#24182b;
}

a{
  text-decoration:none;
  color:inherit;
}

/* TOPO */

header{
  background:white;
  border-bottom:1px solid #eadff2;
  position:sticky;
  top:0;
  z-index:20;
}

.topo{
  max-width:1100px;
  margin:auto;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#7330a8;
  font-size:21px;
  font-weight:900;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#8f3fd1,#ff4fa3);
  color:white;
  font-size:20px;
}

.anunciar{
  background:#7e35b7;
  color:white;
  border-radius:20px;
  padding:10px 15px;
  font-size:13px;
  font-weight:800;
}

/* HERO */

.hero{
  max-width:1100px;
  margin:auto;
  padding:18px 12px 8px;
}

.hero-box{
  padding:22px 17px;
  border-radius:22px;
  color:white;
  background:linear-gradient(135deg,#7430ad,#a348d2,#e255ad);
}

.hero h1{
  margin:0;
  font-size:30px;
  line-height:1.05;
}

.hero p{
  margin:9px 0 0;
  font-size:14px;
  line-height:1.45;
}

/* BUSCA */

.busca-area{
  max-width:1100px;
  margin:auto;
  padding:8px 12px 12px;
}

.busca{
  background:white;
  border:1px solid #e9deef;
  border-radius:18px;
  padding:11px;
  box-shadow:0 8px 25px rgba(75,35,95,.08);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.campo{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.campo label{
  font-size:11px;
  font-weight:800;
  color:#796b84;
}

select,
input{
  width:100%;
  min-height:46px;
  border:1px solid #e4d7eb;
  border-radius:13px;
  background:white;
  padding:0 11px;
  color:#25192c;
  font-size:14px;
  outline:none;
}

.campo-livre{
  grid-column:1 / -1;
}

.buscar{
  grid-column:1 / -1;
  min-height:48px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#8f3fd1,#6e299f);
  color:white;
  font-weight:900;
  font-size:15px;
}

/* CONTEÚDO */

main{
  max-width:1100px;
  margin:auto;
  padding:4px 12px 35px;
}

.titulo-area{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:10px;
  margin:8px 0 12px;
}

.titulo-area h2{
  margin:0;
  font-size:21px;
}

.contador{
  margin-top:3px;
  font-size:12px;
  color:#80738a;
}

.limpar{
  border:0;
  background:transparent;
  color:#7735a6;
  font-weight:800;
  padding:5px;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.card{
  min-width:0;
  overflow:hidden;
  border-radius:16px;
  background:white;
  border:1px solid #e8ddec;
  box-shadow:0 6px 18px rgba(60,30,75,.07);
  cursor:pointer;
}

.foto{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4;
  overflow:hidden;
  background:#eee7f2;
}

.foto img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
}

.sem-foto{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8b7797;
  font-size:13px;
  font-weight:700;
}

.selo{
  position:absolute;
  top:7px;
  left:7px;
  background:rgba(83,36,105,.86);
  color:white;
  padding:5px 7px;
  border-radius:20px;
  font-size:9px;
  font-weight:900;
}

.coracao{
  position:absolute;
  top:7px;
  right:7px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:#b02d85;
  font-size:18px;
}

.info{
  padding:9px;
}

.nome{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.local{
  margin-top:4px;
  font-size:11px;
  color:#82758a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.descricao{
  margin-top:7px;
  font-size:12px;
  line-height:1.35;
  color:#55495d;
  height:33px;
  overflow:hidden;
}

.preco{
  margin-top:8px;
  color:#6c2aa1;
  font-size:12px;
  font-weight:900;
}

.vazio{
  display:none;
  padding:30px 15px;
  border:1px dashed #d9c8e5;
  border-radius:17px;
  background:white;
  text-align:center;
  color:#766b7e;
}

/* MODAL PERFIL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  padding:15px;
  background:rgba(20,10,25,.68);
  overflow:auto;
}

.modal.ativo{
  display:block;
}

.modal-box{
  max-width:520px;
  margin:20px auto;
  border-radius:22px;
  background:white;
  overflow:hidden;
}

.modal-foto{
  width:100%;
  aspect-ratio:3 / 4;
  max-height:520px;
  background:#eee7f2;
}

.modal-foto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-info{
  padding:16px;
}

.modal-topo{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.modal-topo h2{
  margin:0;
}

.fechar{
  border:0;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:20px;
  background:#f2e8f7;
}

.modal-local{
  margin-top:5px;
  color:#7c7084;
  font-size:13px;
}

.modal-desc{
  margin-top:14px;
  line-height:1.5;
  color:#514658;
}

.valores{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:15px;
}

.valor{
  text-align:center;
  border:1px solid #eadff0;
  border-radius:12px;
  padding:10px 5px;
  background:#fcf9fd;
}

.valor small{
  display:block;
  color:#897c91;
  font-size:10px;
}

.valor strong{
  display:block;
  color:#6e299f;
  font-size:13px;
  margin-top:3px;
}

.whatsapp{
  width:100%;
  margin-top:14px;
  border:0;
  min-height:48px;
  border-radius:14px;
  background:#7432ad;
  color:white;
  font-weight:900;
}

/* TELAS MAIORES */

@media(min-width:750px){

  .busca{
    grid-template-columns:1fr 1fr 1.3fr auto;
  }

  .campo-livre{
    grid-column:auto;
  }

  .buscar{
    grid-column:auto;
    padding:0 25px;
    align-self:end;
  }

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
  }

  .hero h1{
    font-size:42px;
  }
}
</style>
</head>

<body>

<header>
  <div class="topo">

    <a href="index.html" class="logo">
      <span class="logo-icon">♥</span>
      <span>Lilás Club</span>
    </a>

    <a href="anunciar.html" class="anunciar">
      ANUNCIAR
    </a>

  </div>
</header>

<section class="hero">
  <div class="hero-box">

    <h1>Encontre o perfil ideal para você.</h1>

    <p>
      Pesquise por estado, cidade, bairro ou pelo nome do perfil.
    </p>

  </div>
</section>

<section class="busca-area">

  <div class="busca">

    <div class="campo">

      <label>ESTADO</label>

      <select id="estado">
        <option value="">Todos os estados</option>
      </select>

    </div>

    <div class="campo">

      <label>CIDADE</label>

      <select id="cidade">
        <option value="">Todas as cidades</option>
      </select>

    </div>

    <div class="campo campo-livre">

      <label>BUSCA LIVRE</label>

      <input
        id="textoBusca"
        type="search"
        placeholder="Nome, estado, cidade ou bairro"
      >

    </div>

    <button
      id="buscar"
      class="buscar"
      type="button"
    >
      🔎 BUSCAR
    </button>

  </div>

</section>

<main>

  <div class="titulo-area">

    <div>
      <h2>Perfis</h2>
      <div id="contador" class="contador">
        0 perfis encontrados
      </div>
    </div>

    <button
      id="limpar"
      class="limpar"
      type="button"
    >
      Limpar busca
    </button>

  </div>

  <div
    id="grid"
    class="grid"
  ></div>

  <div
    id="vazio"
    class="vazio"
  >
    <strong>Nenhum perfil encontrado.</strong>
    <br>
    Tente outra cidade, estado, bairro ou nome.
  </div>

</main>

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div
      id="modalFoto"
      class="modal-foto"
    ></div>

    <div class="modal-info">

      <div class="modal-topo">

        <div>
          <h2 id="modalNome">Perfil</h2>
          <div
            id="modalLocal"
            class="modal-local"
          ></div>
        </div>

        <button
          id="fechar"
          class="fechar"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        id="modalDesc"
        class="modal-desc"
      ></div>

      <div class="valores">

        <div class="valor">
          <small>15 MIN</small>
          <strong id="valor15">—</strong>
        </div>

        <div class="valor">
          <small>30 MIN</small>
          <strong id="valor30">—</strong>
        </div>

        <div class="valor">
          <small>1 HORA</small>
          <strong id="valor60">—</strong>
        </div>

      </div>

      <button
        id="whatsapp"
        class="whatsapp"
        type="button"
      >
        WhatsApp
      </button>

    </div>

  </div>

</div>

<script>

/* ELEMENTOS */

const estado =
document.getElementById("estado");

const cidade =
document.getElementById("cidade");

const textoBusca =
document.getElementById("textoBusca");

const buscar =
document.getElementById("buscar");

const limpar =
document.getElementById("limpar");

const grid =
document.getElementById("grid");

const contador =
document.getElementById("contador");

const vazio =
document.getElementById("vazio");

const modal =
document.getElementById("modal");

const fechar =
document.getElementById("fechar");

const modalFoto =
document.getElementById("modalFoto");

const modalNome =
document.getElementById("modalNome");

const modalLocal =
document.getElementById("modalLocal");

const modalDesc =
document.getElementById("modalDesc");

const valor15 =
document.getElementById("valor15");

const valor30 =
document.getElementById("valor30");

const valor60 =
document.getElementById("valor60");

const whatsapp =
document.getElementById("whatsapp");


let perfis = [];
let perfilAtual = null;


/* FUNÇÕES AUXILIARES */

function txt(v){

  if(
    v === undefined ||
    v === null
  ){
    return "";
  }

  return String(v).trim();

}


function normal(v){

  return txt(v)
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .toLowerCase();

}


function pegar(obj,nomes){

  for(const nome of nomes){

    if(
      obj &&
      obj[nome] !== undefined &&
      obj[nome] !== null &&
      txt(obj[nome]) !== ""
    ){
      return obj[nome];
    }

  }

  return "";

}


function lerJSON(valor){

  try{
    return JSON.parse(valor);
  }
  catch{
    return null;
  }

}


/* FOTO */

function acharFoto(p){

  let foto =
  pegar(
    p,
    [
      "fotoCapa",
      "foto",
      "capa",
      "imagem",
      "image",
      "photo",
      "avatar",
      "fotoPrincipal"
    ]
  );

  if(foto){
    return foto;
  }


  const listas = [
    p.fotos,
    p.galeria,
    p.imagens,
    p.images
  ];


  for(const lista of listas){

    if(
      Array.isArray(lista) &&
      lista.length
    ){

      const primeira = lista[0];

      if(typeof primeira === "string"){
        return primeira;
      }

      if(
        primeira &&
        typeof primeira === "object"
      ){

        foto =
        pegar(
          primeira,
          [
            "url",
            "src",
            "foto",
            "imagem"
          ]
        );

        if(foto){
          return foto;
        }

      }

    }

  }


  return "";

}


/* NORMALIZA PERFIL */

function prepararPerfil(p){

  return {

    original:p,

    nome:
    pegar(
      p,
      [
        "nome",
        "name",
        "apelido",
        "titulo"
      ]
    ) || "Perfil",

    idade:
    pegar(
      p,
      [
        "idade",
        "age"
      ]
    ),

    estado:
    pegar(
      p,
      [
        "estado",
        "uf",
        "state"
      ]
    ),

    cidade:
    pegar(
      p,
      [
        "cidade",
        "municipio",
        "city"
      ]
    ),

    bairro:
    pegar(
      p,
      [
        "bairro",
        "neighborhood"
      ]
    ),

    descricao:
    pegar(
      p,
      [
        "descricao",
        "description",
        "sobre",
        "bio",
        "frase"
      ]
    ),

    categoria:
    pegar(
      p,
      [
        "categoria",
        "category"
      ]
    ),

    whatsapp:
    pegar(
      p,
      [
        "whatsapp",
        "telefone",
        "phone",
        "contato"
      ]
    ),

    preco15:
    pegar(
      p,
      [
        "valor15",
        "preco15",
        "valor_15",
        "preco_15"
      ]
    ),

    preco30:
    pegar(
      p,
      [
        "valor30",
        "preco30",
        "valor_30",
        "preco_30"
      ]
    ),

    preco60:
    pegar(
      p,
      [
        "valor60",
        "preco60",
        "valor1h",
        "preco1h",
        "valor_60"
      ]
    ),

    verificado:
    Boolean(
      pegar(
        p,
        [
          "verificado",
          "verified"
        ]
      )
    ),

    foto:
    acharFoto(p)

  };

}


/* CARREGA PERFIS SALVOS */

function carregar(){

  const encontrados = [];


  const chaves = [

    "lilasPerfil",

    "lilasPerfis",

    "perfilLilas",

    "perfisLilas",

    "perfisLilás"

  ];


  for(const chave of chaves){

    const bruto =
    localStorage.getItem(chave);

    if(!bruto){
      continue;
    }


    const dado =
    lerJSON(bruto);


    if(Array.isArray(dado)){

      encontrados.push(...dado);

    }

    else if(
      dado &&
      typeof dado === "object"
    ){

      encontrados.push(dado);

    }

  }


  /*
  Procura também automaticamente
  outras chaves que contenham
  lilas + perfil
  */

  for(
    let i = 0;
    i < localStorage.length;
    i++
  ){

    const chave =
    localStorage.key(i);

    const n =
    normal(chave);


    if(
      !n.includes("lilas") ||
      !n.includes("perfil")
    ){
      continue;
    }


    if(chaves.includes(chave)){
      continue;
    }


    const dado =
    lerJSON(
      localStorage.getItem(chave)
    );


    if(Array.isArray(dado)){

      encontrados.push(...dado);

    }

    else if(
      dado &&
      typeof dado === "object"
    ){

      encontrados.push(dado);

    }

  }


  /*
  Evita perfil duplicado
  */

  const resultado = [];
  const vistos = new Set();


  encontrados.forEach(p=>{

    const perfil =
    prepararPerfil(p);


    const codigo = [

      normal(perfil.nome),

      normal(perfil.cidade),

      normal(perfil.estado),

      normal(perfil.whatsapp)

    ].join("|");


    if(vistos.has(codigo)){
      return;
    }


    vistos.add(codigo);

    resultado.push(perfil);

  });


  return resultado;

}


/* ESTADOS */

function preencherEstados(){

  const estados = [

    ...new Set(

      perfis

      .map(
        p => txt(p.estado)
      )

      .filter(Boolean)

    )

  ];


  estados.sort(
    (a,b)=>
    a.localeCompare(
      b,
      "pt-BR"
    )
  );


  estado.innerHTML =
  '<option value="">Todos os estados</option>';


  estados.forEach(nome=>{

    const op =
    document.createElement("option");

    op.value = nome;
    op.textContent = nome;

    estado.appendChild(op);

  });

}


/* CIDADES */

function preencherCidades(){

  const e =
  normal(
    estado.value
  );


  const cidades = [

    ...new Set(

      perfis

      .filter(
        p =>
        !e ||
        normal(p.estado) === e
      )

      .map(
        p => txt(p.cidade)
      )

      .filter(Boolean)

    )

  ];


  cidades.sort(
    (a,b)=>
    a.localeCompare(
      b,
      "pt-BR"
    )
  );


  cidade.innerHTML =
  '<option value="">Todas as cidades</option>';


  cidades.forEach(nome=>{

    const op =
    document.createElement("option");

    op.value = nome;
    op.textContent = nome;

    cidade.appendChild(op);

  });

}


/* DINHEIRO */

function dinheiro(valor){

  const v =
  txt(valor);

  if(!v){
    return "—";
  }


  if(v.includes("R$")){
    return v;
  }


  const numero =
  Number(
    v
    .replace(/[^\d,.]/g,"")
    .replace(".","")
    .replace(",",".")
  );


  if(
    Number.isFinite(numero) &&
    numero > 0
  ){

    return numero.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    );

  }


  return v;

}


/* CRIA FOTO */

function fotoHTML(p){

  if(!p.foto){

    return `
      <div class="sem-foto">
        Foto do perfil
      </div>
    `;

  }


  return `
    <img
      src="${p.foto}"
      alt="${p.nome}"
    >
  `;

}


/* CRIA CARD */

function criarCard(p){

  const card =
  document.createElement("div");

  card.className = "card";


  const nomeCompleto =
  p.idade
  ?
  `${p.nome}, ${p.idade}`
  :
  p.nome;


  const local = [

    p.bairro,

    p.cidade,

    p.estado

  ]

  .filter(Boolean)

  .join(" • ");


  const valor =
  p.preco60 ||
  p.preco30 ||
  p.preco15;


  card.innerHTML = `

    <div class="foto">

      ${fotoHTML(p)}

      ${
        p.verificado
        ?
        '<span class="selo">VERIFICADO</span>'
        :
        ""
      }

      <button
        class="coracao"
        type="button"
      >
        ♡
      </button>

    </div>


    <div class="info">

      <div class="nome">
        ${nomeCompleto}
      </div>

      <div class="local">
        ${
          local ||
          "Local não informado"
        }
      </div>

      <div class="descricao">

        ${
          p.descricao ||
          p.categoria ||
          "Toque para ver o perfil."
        }

      </div>

      <div class="preco">

        ${
          valor
          ?
          "A partir de " +
          dinheiro(valor)
          :
          "Consulte valores"
        }

      </div>

    </div>

  `;


  card.addEventListener(
    "click",
    e=>{

      if(
        e.target.classList.contains(
          "coracao"
        )
      ){
        return;
      }

      abrirPerfil(p);

    }
  );


  const coracao =
  card.querySelector(".coracao");


  coracao.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      coracao.textContent =
      coracao.textContent === "♡"
      ?
      "♥"
      :
      "♡";

    }
  );


  return card;

}


/* MOSTRA PERFIS */

function mostrar(lista){

  grid.innerHTML = "";


  lista.forEach(p=>{

    grid.appendChild(
      criarCard(p)
    );

  });


  const total =
  lista.length;


  contador.textContent =

  total === 1

  ?

  "1 perfil encontrado"

  :

  `${total} perfis encontrados`;


  if(total === 0){

    grid.style.display =
    "none";

    vazio.style.display =
    "block";

  }

  else{

    grid.style.display =
    "grid";

    vazio.style.display =
    "none";

  }

}


/* BUSCA */

function fazerBusca(){

  const e =
  normal(
    estado.value
  );


  const c =
  normal(
    cidade.value
  );


  const buscaLivre =
  normal(
    textoBusca.value
  );


  const resultado =
  perfis.filter(p=>{


    const bateEstado =

    !e ||

    normal(p.estado) === e;


    const bateCidade =

    !c ||

    normal(p.cidade) === c;


    const textoPerfil = [

      p.nome,

      p.estado,

      p.cidade,

      p.bairro,

      p.categoria,

      p.descricao

    ]

    .map(normal)

    .join(" ");


    const bateTexto =

    !buscaLivre ||

    textoPerfil.includes(
      buscaLivre
    );


    return (

      bateEstado &&

      bateCidade &&

      bateTexto

    );

  });


  mostrar(resultado);

}


/* ABRE PERFIL */

function abrirPerfil(p){

  perfilAtual = p;


  try{

    localStorage.setItem(

      "lilasPerfilSelecionado",

      JSON.stringify(
        p.original
      )

    );

  }
  catch{}


  modalFoto.innerHTML =
  fotoHTML(p);


  modalNome.textContent =

  p.idade

  ?

  `${p.nome}, ${p.idade}`

  :

  p.nome;


  modalLocal.textContent = [

    p.bairro,

    p.cidade,

    p.estado

  ]

  .filter(Boolean)

  .join(" • ");


  modalDesc.textContent =

  p.descricao ||

  "Sem descrição informada.";


  valor15.textContent =
  dinheiro(
    p.preco15
  );


  valor30.textContent =
  dinheiro(
    p.preco30
  );


  valor60.textContent =
  dinheiro(
    p.preco60
  );


  whatsapp.style.display =

  p.whatsapp

  ?

  "block"

  :

  "none";


  modal.classList.add(
    "ativo"
  );

}


/* FECHA PERFIL */

function fecharPerfil(){

  modal.classList.remove(
    "ativo"
  );

}


/* WHATSAPP */

function abrirWhats(){

  if(
    !perfilAtual ||
    !perfilAtual.whatsapp
  ){
    return;
  }


  const numero =

  txt(
    perfilAtual.whatsapp
  )

  .replace(
    /\D/g,
    ""
  );


  if(!numero){
    return;
  }


  const mensagem =

  encodeURIComponent(

    `Olá! Vi o perfil de ${perfilAtual.nome} no Lilás Club.`

  );


  window.open(

    `https://wa.me/${numero}?text=${mensagem}`,

    "_blank"

  );

}


/* EVENTOS */

estado.addEventListener(
  "change",
  ()=>{

    preencherCidades();

  }
);


buscar.addEventListener(
  "click",
  fazerBusca
);


textoBusca.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){

      fazerBusca();

    }

  }
);


limpar.addEventListener(
  "click",
  ()=>{

    estado.value = "";

    preencherCidades();

    cidade.value = "";

    textoBusca.value = "";

    mostrar(perfis);

  }
);


fechar.addEventListener(
  "click",
  fecharPerfil
);


whatsapp.addEventListener(
  "click",
  abrirWhats
);


modal.addEventListener(
  "click",
  e=>{

    if(
      e.target === modal
    ){

      fecharPerfil();

    }

  }
);


/* INICIA */

function iniciar(){

  perfis =
  carregar();


  preencherEstados();

  preencherCidades();

  mostrar(perfis);


  console.log(

    "Lilás Club carregou",

    perfis.length,

    "perfil/perfis"

  );

}


iniciar();

</script>
