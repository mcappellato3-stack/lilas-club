<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Lilás Club"
  >

  <title>Lilás Club</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --lilas: #8c35ad;
      --lilas-escuro: #66227d;
      --rosa: #d84b9a;
      --vermelho: #d93455;
      --branco: #ffffff;
      --fundo: #f5f5f7;
      --texto: #252525;
      --cinza: #777;
      --borda: #e5e5e5;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    /* =========================
       LOGO
    ========================== */

    header {
      background: white;
      border-bottom: 1px solid #ececec;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-interno {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }

    .logo-coracao {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--lilas);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      line-height: 1;
      box-shadow: 0 2px 7px rgba(140, 53, 173, .22);
    }

    .logo-nome {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .logo-lilas {
      color: var(--lilas);
    }

    .logo-club {
      color: var(--vermelho);
    }

    /* =========================
       PÁGINA
    ========================== */

    .container {
      width: min(100%, 1100px);
      margin: auto;
      padding: 14px 12px 40px;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          #7c299d,
          #c54492
        );

      color: white;
      padding: 21px 16px;
      border-radius: 17px;
      text-align: center;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .hero p {
      font-size: 13px;
      opacity: .96;
    }

    /* =========================
       BUSCA
    ========================== */

    .busca-box {
      background: white;
      padding: 14px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
      margin-bottom: 19px;
    }

    .busca-titulo {
      font-size: 16px;
      font-weight: 800;
      color: var(--lilas);
      margin-bottom: 10px;
    }

    .campos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }

    select,
    input {
      width: 100%;
      height: 47px;
      border: 1px solid #ddd;
      border-radius: 11px;
      background: white;
      font-size: 15px;
      padding: 0 12px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--lilas);
      box-shadow: 0 0 0 2px rgba(140,53,173,.08);
    }

    #buscar {
      width: 100%;
      height: 48px;
      margin-top: 10px;
      border: none;
      border-radius: 11px;
      background: var(--lilas);
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #buscar:active {
      transform: scale(.99);
    }

    .dica-busca {
      font-size: 11px;
      color: #8a8a8a;
      margin-top: 8px;
      line-height: 1.35;
    }

    /* =========================
       RESULTADOS
    ========================== */

    .topo-resultados {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 2px 12px;
    }

    .topo-resultados h2 {
      font-size: 18px;
    }

    #quantidade {
      color: #777;
      font-size: 12px;
    }

    #listaPerfis {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .perfil-card {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.09);
      cursor: pointer;
      min-width: 0;
    }

    .perfil-card:active {
      transform: scale(.985);
    }

    /* =========================
       FOTO
    ========================== */

    .foto-box {
      width: 100%;
      height: 190px;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
    }

    .foto-box img {
      display: block;
      max-width: 92%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      border-radius: 8px;
    }

    /* =========================
       INFORMAÇÕES DO PERFIL
    ========================== */

    .perfil-info {
      padding: 9px;
    }

    .linha-nome {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
    }

    .nome {
      font-size: 15px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .verificada {
      color: var(--lilas);
      font-weight: 900;
    }

    .local {
      color: #777;
      font-size: 11px;
      margin-top: 5px;
      line-height: 1.35;
    }

    .descricao {
      color: #555;
      font-size: 11px;
      line-height: 1.35;
      margin-top: 6px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

      min-height: 29px;
    }

    .preco {
      margin-top: 7px;
      color: var(--lilas);
      font-weight: 800;
      font-size: 14px;
    }

    .recursos {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .recurso {
      background: #f2e5f7;
      color: var(--lilas);
      border-radius: 6px;
      padding: 3px 5px;
      font-size: 10px;
    }

    .sem-resultado {
      grid-column: 1 / -1;
      background: white;
      border-radius: 14px;
      text-align: center;
      padding: 28px 16px;
      color: #777;
    }

    .sem-resultado strong {
      display: block;
      color: var(--lilas);
      font-size: 16px;
      margin-bottom: 6px;
    }

    .acoes {
      text-align: center;
      margin-top: 23px;
    }

    .anunciar {
      display: inline-block;
      background: var(--rosa);
      color: white;
      text-decoration: none;
      font-weight: 800;
      padding: 13px 22px;
      border-radius: 11px;
    }

    @media (min-width: 600px) {
      .campos {
        grid-template-columns: 1fr 1fr;
      }

      #listaPerfis {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 15px;
      }

      .foto-box {
        height: 245px;
      }
    }

    @media (min-width: 950px) {
      #listaPerfis {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

<main class="container">

<script>

const listaPerfis =
  document.getElementById("listaPerfis");

const campoEstado =
  document.getElementById("estado");

const campoLocal =
  document.getElementById("localBusca");

const botaoBuscar =
  document.getElementById("buscar");

const quantidade =
  document.getElementById("quantidade");


/* ===========================
   NORMALIZA TEXTO
=========================== */

function normalizar(texto) {

  return String(texto || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


/* ===========================
   NOMES DOS ESTADOS
=========================== */

const estados = {

  AC: "acre",
  AL: "alagoas",
  AP: "amapa",
  AM: "amazonas",
  BA: "bahia",
  CE: "ceara",
  DF: "distrito federal",
  ES: "espirito santo",
  GO: "goias",
  MA: "maranhao",
  MT: "mato grosso",
  MS: "mato grosso do sul",
  MG: "minas gerais",
  PA: "para",
  PB: "paraiba",
  PR: "parana",
  PE: "pernambuco",
  PI: "piaui",
  RJ: "rio de janeiro",
  RN: "rio grande do norte",
  RS: "rio grande do sul",
  RO: "rondonia",
  RR: "roraima",
  SC: "santa catarina",
  SP: "sao paulo",
  SE: "sergipe",
  TO: "tocantins"

};


/* ===========================
   SINÔNIMOS / ERROS COMUNS
=========================== */

const equivalencias = {

  "centre": "centro",
  "center": "centro",

  "sao paolo": "sao paulo",
  "saopaulo": "sao paulo",

  "rio janeiro": "rio de janeiro",

  "bh": "belo horizonte",

  "sampa": "sao paulo"

};


function aplicarEquivalencias(texto) {

  let resultado =
    normalizar(texto);


  Object.keys(equivalencias)
    .forEach(chave => {

      const regex =
        new RegExp(
          "\\b" + chave + "\\b",
          "g"
        );

      resultado =
        resultado.replace(
          regex,
          equivalencias[chave]
        );

    });


  return resultado;

}


/* ===========================
   LEVENSHTEIN
=========================== */

function distancia(a, b) {

  a = normalizar(a);
  b = normalizar(b);


  const matriz =
    Array.from(
      { length: b.length + 1 },
      () =>
        new Array(a.length + 1)
    );


  for (
    let i = 0;
    i <= b.length;
    i++
  ) {

    matriz[i][0] = i;

  }


  for (
    let j = 0;
    j <= a.length;
    j++
  ) {

    matriz[0][j] = j;

  }


  for (
    let i = 1;
    i <= b.length;
    i++
  ) {

    for (
      let j = 1;
      j <= a.length;
      j++
    ) {

      if (
        b[i - 1] === a[j - 1]
      ) {

        matriz[i][j] =
          matriz[i - 1][j - 1];

      } else {

        matriz[i][j] =
          Math.min(

            matriz[i - 1][j - 1] + 1,

            matriz[i][j - 1] + 1,

            matriz[i - 1][j] + 1

          );

      }

    }

  }


  return matriz[b.length][a.length];

}


/* ===========================
   PALAVRAS PARECIDAS
=========================== */

function palavraCombina(
  procurada,
  existente
) {

  procurada =
    normalizar(procurada);

  existente =
    normalizar(existente);


  if (
    !procurada ||
    !existente
  ) {

    return false;

  }


  if (
    existente.includes(procurada) ||
    procurada.includes(existente)
  ) {

    return true;

  }


  if (procurada.length <= 3) {

    return existente.startsWith(
      procurada
    );

  }


  const erro =
    distancia(
      procurada,
      existente
    );


  let limite = 1;


  if (procurada.length >= 8) {
    limite = 2;
  }


  return erro <= limite;

}


/* ===========================
   BUSCA FLEXÍVEL
=========================== */

function textoCombina(
  termoBusca,
  textoPerfil
) {

  const busca =
    aplicarEquivalencias(
      termoBusca
    );


  const texto =
    aplicarEquivalencias(
      textoPerfil
    );


  if (!busca) {
    return true;
  }


  if (!texto) {
    return false;
  }


  if (
    texto.includes(busca)
  ) {

    return true;

  }


  const palavrasBusca =
    busca
      .split(" ")
      .filter(Boolean);


  const palavrasPerfil =
    texto
      .split(" ")
      .filter(Boolean);


  return palavrasBusca.every(
    palavra =>

      palavrasPerfil.some(
        palavraPerfil =>

          palavraCombina(
            palavra,
            palavraPerfil
          )

      )

  );

}


/* ===========================
   CARREGA PERFIS
=========================== */

function carregarPerfis() {

  const perfis = [];

  const chaves = [

    "lilasPerfis",
    "lilasPerfil",
    "perfis",
    "perfil"

  ];


  chaves.forEach(
    chave => {

      try {

        const bruto =
          localStorage.getItem(
            chave
          );


        if (!bruto) {
          return;
        }


        const valor =
          JSON.parse(bruto);


        if (
          Array.isArray(valor)
        ) {

          valor.forEach(
            item => {

              if (item) {
                perfis.push(item);
              }

            }
          );

        } else if (valor) {

          perfis.push(valor);

        }

      } catch (erro) {

        console.log(
          "Erro ao ler",
          chave
        );

      }

    }
  );


  /* remove duplicados */

  const unicos = [];
  const vistos = new Set();


  perfis.forEach(
    perfil => {

      const chave =
        JSON.stringify(perfil);


      if (
        !vistos.has(chave)
      ) {

        vistos.add(chave);

        unicos.push(perfil);

      }

    }
  );


  return unicos;

}


/* ===========================
   CAMPOS DO PERFIL
=========================== */

function primeiro(
  perfil,
  campos
) {

  for (
    const campo of campos
  ) {

    if (
      perfil &&
      perfil[campo] !== undefined &&
      perfil[campo] !== null &&
      String(perfil[campo]).trim() !== ""
    ) {

      return perfil[campo];

    }

  }


  return "";

}


function obterNome(perfil) {

  return primeiro(
    perfil,
    [
      "nome",
      "nomeArtistico",
      "nomeCompleto",
      "apelido",
      "titulo"
    ]
  ) || "Perfil";

}


function obterEstado(perfil) {

  return primeiro(
    perfil,
    [
      "estado",
      "uf",
      "siglaEstado",
      "state"
    ]
  );

}


function obterCidade(perfil) {

  return primeiro(
    perfil,
    [
      "cidade",
      "municipio",
      "city",
      "localidade",
      "cidadeAtendimento"
    ]
  );

}


function obterBairro(perfil) {

  return primeiro(
    perfil,
    [
      "bairro",
      "bairroAtendimento",
      "neighborhood",
      "district"
    ]
  );

}


function obterRegiao(perfil) {

  return primeiro(
    perfil,
    [
      "regiao",
      "zona",
      "area",
      "local",
      "localizacao"
    ]
  );

}


function obterDescricao(perfil) {

  return primeiro(
    perfil,
    [
      "descricao",
      "bio",
      "frase",
      "sobre",
      "apresentacao"
    ]
  );

}


/* ===========================
   FOTO
=========================== */

function obterFoto(perfil) {

  const direta =
    primeiro(
      perfil,
      [
        "fotoCapa",
        "foto",
        "capa",
        "imagem",
        "image",
        "photo"
      ]
    );


  if (direta) {

    return direta;

  }


  const listas = [

    perfil.fotos,
    perfil.galeria,
    perfil.images,
    perfil.photos

  ];


  for (
    const lista of listas
  ) {

    if (
      Array.isArray(lista) &&
      lista.length > 0
    ) {

      if (
        typeof lista[0] === "string"
      ) {

        return lista[0];

      }


      if (
        lista[0] &&
        lista[0].url
      ) {

        return lista[0].url;

      }

    }

  }


  return "";

}


/* ===========================
   PREÇO
=========================== */

function obterPreco(perfil) {

  const valor =
    primeiro(
      perfil,
      [
        "valor1hora",
        "valor1Hora",
        "valorHora",
        "precoHora",
        "preco1hora",
        "valor"
      ]
    );


  if (!valor) {
    return "";
  }


  const texto =
    String(valor);


  if (
    texto.includes("R$") ||
    texto.includes("£") ||
    texto.includes("€") ||
    texto.includes("$")
  ) {

    return texto;

  }


  return "R$ " + texto;

}


/* ===========================
   TEXTO PESQUISÁVEL
=========================== */

function criarTextoPesquisa(
  perfil
) {

  const partes = [

    obterCidade(perfil),

    obterBairro(perfil),

    obterRegiao(perfil),

    obterEstado(perfil)

  ];


  /*
    Também procura em outros
    campos curtos do cadastro.
  */

  Object.values(
    perfil || {}
  )
  .forEach(
    valor => {

      if (
        typeof valor === "string" &&
        valor.length <= 120 &&
        !valor.startsWith("data:image")
      ) {

        partes.push(valor);

      }

    }
  );


  return partes
    .filter(Boolean)
    .join(" ");

}


/* ===========================
   ESTADO
=========================== */

function estadoCombina(
  selecionado,
  perfilEstado
) {

  if (!selecionado) {
    return true;
  }


  const sigla =
    normalizar(
      selecionado
    );


  const nome =
    normalizar(
      estados[
        selecionado
      ] || ""
    );


  const salvo =
    normalizar(
      perfilEstado
    );


  if (!salvo) {

    /*
      Se perfil antigo não tiver
      estado salvo, não bloqueia.
    */

    return true;

  }


  return (

    salvo === sigla ||

    salvo === nome ||

    salvo.includes(nome) ||

    nome.includes(salvo)

  );

}


/* ===========================
   CARD
=========================== */

function criarCard(
  perfil,
  indice
) {

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "perfil-card";


  const nome =
    obterNome(perfil);

  const foto =
    obterFoto(perfil);

  const cidade =
    obterCidade(perfil);

  const bairro =
    obterBairro(perfil);

  const regiao =
    obterRegiao(perfil);

  const descricao =
    obterDescricao(perfil);

  const preco =
    obterPreco(perfil);


  const local =
    [
      bairro,
      cidade,
      regiao
    ]
    .filter(Boolean)
    .filter(
      (item, indice, array) =>
        array.indexOf(item) === indice
    )
    .join(" • ");


  card.innerHTML = `

    <div class="foto-box">

      ${
        foto

        ? `
          <img
            src="${foto}"
            alt="${nome}"
          >
        `

        : `
          <div
            style="
              color:#888;
              font-size:12px;
            "
          >
            Sem foto
          </div>
        `
      }

    </div>


    <div class="perfil-info">

      <div class="linha-nome">

        <div class="nome">
          ${nome}
        </div>

        <div class="verificada">
          ✓
        </div>

      </div>


      ${
        local

        ? `
          <div class="local">
            📍 ${local}
          </div>
        `

        : ""
      }


      ${
        descricao

        ? `
          <div class="descricao">
            ${descricao}
          </div>
        `

        : ""
      }


      ${
        preco

        ? `
          <div class="preco">
            ${preco}
          </div>
        `

        : ""
      }


      <div class="recursos">

        ${
          perfil.video

          ? `
            <span class="recurso">
              ▶ Vídeo
            </span>
          `

          : ""
        }


        ${
          perfil.audio

          ? `
            <span class="recurso">
              🎙 Áudio
            </span>
          `

          : ""
        }

      </div>

    </div>
  `;


  card.addEventListener(
    "click",
    () => {

      localStorage.setItem(
        "lilasPerfilSelecionado",
        JSON.stringify(perfil)
      );


      localStorage.setItem(
        "lilasPerfilSelecionadoIndice",
        String(indice)
      );


      window.location.href =
        "perfil.html";

    }
  );


  return card;

}


/* ===========================
   MOSTRA RESULTADOS
=========================== */

function mostrarPerfis(
  perfis
) {

  listaPerfis.innerHTML = "";


  quantidade.textContent =
    perfis.length === 1

      ? "1 perfil"

      : `${perfis.length} perfis`;


  if (
    perfis.length === 0
  ) {

    listaPerfis.innerHTML = `

      <div class="sem-resultado">

        <strong>
          Nenhum perfil encontrado
        </strong>

        Tente escrever a cidade,
        bairro ou região de outra forma.

      </div>
    `;


    return;

  }


  perfis.forEach(
    (perfil, indice) => {

      listaPerfis.appendChild(
        criarCard(
          perfil,
          indice
        )
      );

    }
  );

}


/* ===========================
   FAZ A BUSCA
=========================== */

function buscarPerfis() {

  const todos =
    carregarPerfis();


  const estado =
    campoEstado.value;


  const busca =
    campoLocal.value;


  const resultados =
    todos.filter(
      perfil => {


        const estadoOk =
          estadoCombina(
            estado,
            obterEstado(perfil)
          );


        if (!estadoOk) {
          return false;
        }


        const textoPerfil =
          criarTextoPesquisa(
            perfil
          );


        const localOk =
          textoCombina(
            busca,
            textoPerfil
          );


        return localOk;

      }
    );


  mostrarPerfis(
    resultados
  );

}


/* ===========================
   BOTÃO
=========================== */

botaoBuscar.addEventListener(
  "click",
  buscarPerfis
);


/* Enter */

campoLocal.addEventListener(
  "keydown",
  evento => {

    if (
      evento.key === "Enter"
    ) {

      buscarPerfis();

    }

  }
);


/* ===========================
   BUSCA ENQUANTO DIGITA
=========================== */

let timerBusca;


campoLocal.addEventListener(
  "input",
  () => {

    clearTimeout(
      timerBusca
    );


    timerBusca =
      setTimeout(
        () => {

          buscarPerfis();

        },
        350
      );

  }
);


/* Estado muda */

campoEstado.addEventListener(
  "change",
  buscarPerfis
);


/* ===========================
   ABRE MOSTRANDO PERFIS
=========================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    mostrarPerfis(
      carregarPerfis()
    );

  }
);

</script>
